name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'Terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: Terraform

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_ami_id: ${{ secrets.AMI_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/github-terraform-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=environments/dev init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=environments/dev validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform -chdir=environments/dev plan -no-color -input=false

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=environments/dev apply -auto-approve -input=false
